# Debugging on one small GPU: the Gaussian head on the smaller backbone (DA3-BASE) memorises the first two
# training logs. The evaluation uses fixed moments of the same two logs; the renders at t + 0.5 s and
# t + 1 s must get clearly closer to the photos.
#
#   python scripts/train.py --config configs/stage1_head_overfit_base.yaml \
#       --set run_dir=<dir> data.root=<processed root> model.weights_root=<weights dir> \
#             model.backbone_checkpoint=<last.pt of a stage1_overfit_base run>
base: stage1_head.yaml
total_steps: 2000
num_workers: 6
schedule: {warmup_steps: 100, min_lr: 1.0e-6}
log_every: 25
checkpoint_every: 250
keep_every: 0
eval_every: 500

model:
  name: da3-base
  backbone_checkpoint: null   # set it on the command line; null = the original DA3-BASE weights
  exposure_delay_steps: 200

data:
  train_first: 2
  eval_split: train
  eval_logs: data_lists/av2_train_stage1.txt
  eval_first: 2

loss:
  lpips: {weight: 0.05, ramp_steps: 200}
