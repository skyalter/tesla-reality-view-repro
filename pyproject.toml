[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realityview"
version = "0.0.1"
description = "Reproduction of Tesla FSD v15 Reality View from public material (work in progress)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "opencv-python>=4.8",
    "scipy>=1.14",
    "PyYAML>=6",
    "torch>=2.1",
    "einops>=0.7",
    "safetensors>=0.4",
]

[tool.setuptools.packages.find]
include = ["realityview*"]
